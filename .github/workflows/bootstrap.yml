name: Bootstrap FocuSense source

on:
  push:
    branches:
      - bootstrap/focusense-0.8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', 'Bootstrap FocuSense 0.8 source') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: bootstrap/focusense-0.8
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > "$RUNNER_TEMP/focusense-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/focusense-source.tar.gz" -C .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
          else
            git commit -m "Bootstrap FocuSense 0.8 source"
            git push origin HEAD:bootstrap/focusense-0.8
          fi

      - name: Validate reconstructed project
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintRelease :app:assembleRelease --stacktrace
