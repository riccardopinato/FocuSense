name: Bootstrap FocuSense source

on:
  push:
    branches:
      - bootstrap/focusense-0.8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', 'Bootstrap FocuSense 0.8 source') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: bootstrap/focusense-0.8
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > "$RUNNER_TEMP/focusense-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/focusense-source.tar.gz" -C .
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

          # Stable Android target for current Play requirements.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

          # AGP 9 built-in Kotlin requires a current KSP line.
          sed -i 's/id("com.google.devtools.ksp") version "2.2.10-2.0.2"/id("com.google.devtools.ksp") version "2.3.10"/' build.gradle.kts

          # Obsolete AGP compatibility property.
          sed -i '/android.defaults.buildfeatures.resvalues=true/d' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android API 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
            test -n "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
          else
            git commit -m "Bootstrap FocuSense 0.8 source"
            git push origin HEAD:bootstrap/focusense-0.8
          fi

      - name: Validate reconstructed project
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintRelease :app:assembleRelease --stacktrace
