name: Bootstrap FocuSense source

on:
  push:
    branches:
      - bootstrap/focusense-0.8
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v5
        with:
          ref: bootstrap/focusense-0.8
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > /tmp/focusense-source.tar.gz
          gzip -t /tmp/focusense-source.tar.gz
          tar -tzf /tmp/focusense-source.tar.gz > /tmp/source-files.txt
          grep -q './app/build.gradle.kts' /tmp/source-files.txt
          grep -q './.github/workflows/android.yml' /tmp/source-files.txt
          tar -xzf /tmp/focusense-source.tar.gz -C .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate standard Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Remove bootstrap transport
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          chmod +x gradlew

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocuSense Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "bootstrap: materialize FocuSense 0.8 source"
          git push origin HEAD:bootstrap/focusense-0.8
