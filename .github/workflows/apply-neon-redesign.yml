name: Apply neon UI redesign

on:
  push:
    branches:
      - ui/neon-utility-redesign
    paths:
      - '.ui-redesign/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/neon-utility-redesign
          fetch-depth: 0

      - name: Apply payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .ui-redesign/READY ]; then
            echo "Payload not complete yet."
            exit 0
          fi
          cat .ui-redesign/part* | tr -d '\r\n' | base64 --decode > /tmp/focusense-neon.tar.gz
          gzip -t /tmp/focusense-neon.tar.gz
          tar -xzf /tmp/focusense-neon.tar.gz -C .
          rm -rf .ui-redesign

      - name: Commit redesign
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .ui-redesign ] && git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "FocuSense UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat(ui): ship neon utility redesign"
          git push origin HEAD:ui/neon-utility-redesign
